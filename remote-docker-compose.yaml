# Production deployment: Postgres + the MeshTrove app. The app runs the
# prebuilt ghcr.io/ndevenish/meshtrove:latest image, re-pulled on every `up`.
#
#   cp .env.prod.example .env.prod    # then fill it in
#   docker compose --env-file .env.prod up -d
#
# See docs/deploy.md for the full walkthrough.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: meshtrove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: meshtrove
      # Escape hatch for a genuine first start (empty dataset): ALLOW_DB_INIT=1
      # docker compose --env-file .env.prod up -d. Leave it unset afterwards.
      ALLOW_DB_INIT: ${ALLOW_DB_INIT:-0}
    # Never initialise a cluster we did not mean to initialise. If the machine
    # boots before the ZFS pool is mounted, the bind mount below lands on an
    # empty directory and stock postgres runs initdb there: a second, empty
    # database that then looks perfectly healthy, while the real one sits
    # unmounted. Bail out instead — `restart: unless-stopped` keeps retrying
    # (Docker backs off to 60s), so the stack heals itself the moment the pool
    # appears, with no manual restart. `$$` is escaped so Compose leaves the
    # variable for the container's shell.
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ] && [ "$${ALLOW_DB_INIT:-0}" != 1 ]; then
          echo "FATAL: no Postgres cluster in /var/lib/postgresql/data (PG_VERSION missing)." >&2
          echo "       Is the ZFS dataset mounted? Refusing to initdb over it." >&2
          echo "       Genuine first start: re-run with ALLOW_DB_INIT=1." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      # Long syntax with create_host_path: false — if the pool is not mounted the
      # path does not exist, and Docker must fail the container rather than
      # helpfully creating the directory on the root filesystem.
      - type: bind
        source: /tank/meshtrove/pgdata
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshtrove"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/ndevenish/meshtrove:latest
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    user: "${MESHTROVE_UID:-10001}:${MESHTROVE_GID:-10001}"
    # Same reasoning as the Postgres guard: pgdata and store are separate
    # datasets, so the store can be missing while the DB is fine — and then the
    # app writes blobs to the root filesystem and the DB ends up with rows
    # pointing at files that vanish under the mount. `.dataset-ok` is an empty
    # marker file committed to the dataset itself (`touch
    # /tank/meshtrove/store/.dataset-ok` while it IS mounted), so it is present
    # only when the real store is in place.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -e /app/store/.dataset-ok ]; then
          echo "FATAL: /app/store/.dataset-ok missing — is the ZFS store dataset mounted?" >&2
          echo "       Refusing to write blobs onto the root filesystem." >&2
          exit 1
        fi
        exec meshtrove
    environment:
      # The app applies migrations itself at startup (sqlx::migrate!).
      DATABASE_URL: postgres://meshtrove:${POSTGRES_PASSWORD}@postgres:5432/meshtrove
      # REQUIRED: signing key for session cookies. Sessions are invalidated if it
      # changes, so keep it stable. Generate: openssl rand -base64 64 | tr -d '\n'
      MESHTROVE_COOKIE_KEY: ${MESHTROVE_COOKIE_KEY:?set MESHTROVE_COOKIE_KEY in .env.prod (openssl rand -base64 64 | tr -d '\n')}
      # Optional: bootstrap an admin on first start (username:password). Empty = skip.
      MESHTROVE_CREATE_ADMIN: ${MESHTROVE_CREATE_ADMIN:-}
      MESHTROVE_BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${MESHTROVE_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: /tank/meshtrove/store
        target: /app/store
        bind:
          create_host_path: false
    restart: unless-stopped

  # Optional: webhook-driven redeploy. Watchtower pulls the newest image and
  # recreates `app` with the same config when it receives an authenticated
  # POST /v1/update — nothing else. Polling is off (no schedule configured), so
  # it acts ONLY on that trigger, which the CI workflow sends after publishing a
  # new :latest. See docs/deploy.md → "Automatic redeploy on a new image".
  # Drop this service if you'd rather redeploy by hand.
  watchtower:
    image: nickfedor/watchtower:latest # maintained fork of containrrr/watchtower
    depends_on:
      - app
    volumes:
      # Watchtower drives the Docker daemon to pull + recreate the container.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Enable only the update endpoint; every /v1/* route requires the token.
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:?set WATCHTOWER_TOKEN in .env.prod}
      # Only touch containers carrying the enable label above (i.e. just `app`).
      WATCHTOWER_LABEL_ENABLE: "true"
      # Delete the superseded image after a successful update.
      WATCHTOWER_CLEANUP: "true"
    # Port 8080 is NOT published to the host. Reach it from your Cloudflare tunnel
    # by name (http://watchtower:8080) if cloudflared shares this compose network,
    # or add `ports: ["127.0.0.1:8080:8080"]` if cloudflared runs on the host.
    # See docs/deploy.md — do not expose it to the public internet directly.
    expose:
      - "8080"
    restart: unless-stopped
